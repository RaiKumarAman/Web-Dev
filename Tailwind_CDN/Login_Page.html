<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-slate-90 flex justify-center items-center min-h-screen">
    <div >
        <h2 class="text-center text-6xl text-yellow-800 font-bold pb-5">Login</h2>
        <form class="bg-gray-200 rounded-xl p-5 m-3 flex flex-col justify-center items-center">
            
        <div class="w-60 h-60">
            <img
                src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnJiMml5ajU4b3FyMXBzbDNtNXI3cHd3ZXVnb2llYWdtcmRuOHYxMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/ihbaIfReVictLxeFVu/giphy.gif"
                class="mix-blend-multiply"
                alt=""
            />
        </div>
            <div>
                <label class="block mb-1 text-sm font-medium">Email</label>
                <input type="email" class="mb-4 w-full px-3 py-2 border rounded-md">
            </div>
            <div>
                <label class="block mb-1 text-sm font-medium">Password</label>
                <input type="password" class="w-full px-3 py-2 border rounded-md">
            </div>
            <button type="submit" class="border-0 rounded-3xl border-black p-2 m-3 bg-yellow-900 hover:bg-yellow-700 text-amber-50 w-full ">LogIn</button>
        </form>
        
        
    </div>
</body>
</html>
